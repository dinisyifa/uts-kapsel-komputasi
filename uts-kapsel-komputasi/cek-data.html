<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Cek Dataset NutriCafe</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 20px; }
      table { border-collapse: collapse; font-size: 14px; }
      th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; }
      th { background: #2f9e44; color: white; }
      .kosong { background: #ffe3e3; }
    </style>
  </head>
  <body>
    <h1>Cek Dataset NutriCafe</h1>
    <p id="info"></p>
    <table>
      <thead id="tabel-head"></thead>
      <tbody id="tabel-body"></tbody>
    </table>

    <script src="data/food.json"></script>
    <script src="data/ingredients.json"></script>
    <script>
        const kolom = ["id", "jenis", "nama", "kategori", "ukuran", "harga", "kalori",
                     "lemak", "kolesterol", "sodium", "karbo", "serat", "gula", "protein", "kafein", "bahan"];

      // header tabel
      const head = [];
      kolom.forEach((k) => head.push(`<th>${k}</th>`));
      document.getElementById("tabel-head").innerHTML = `<tr>${head.join("")}</tr>`;

      // isi tabel (pola buildQuiz minggu 2)
      const rows = [];
      let belumDiisi = 0;
      foods.forEach((food) => {
        const dataBahan = ingredients.find((i) => i.menuId === food.id);
        const kosong = food.nama === "";
        if (kosong) belumDiisi++;

        const sel = [];
        kolom.forEach((k) => {
          const nilai = k === "bahan" ? (dataBahan ? dataBahan.bahan.join(", ") : "-") : food[k];
          sel.push(`<td>${nilai}</td>`);
        });
        rows.push(`<tr class="${kosong ? "kosong" : ""}">${sel.join("")}</tr>`);
      });
      document.getElementById("tabel-body").innerHTML = rows.join("");

      document.getElementById("info").innerHTML =
        `Total ${foods.length} menu · ${belumDiisi} belum diisi (baris merah)`;
      console.table(foods);
    </script>
  </body>
</html>
