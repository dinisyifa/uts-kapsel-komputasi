<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Tes Cart</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <h1>Tes Cart</h1>
    <p>Keranjang: <span id="cart-count">0</span></p>
    <div id="toast" style="display: none"></div>
    <div id="cart-empty">Keranjang masih kosong.</div>

    <div id="cart-content">
      <table>
        <thead>
          <tr><th>Menu</th><th>Harga</th><th>Jumlah</th><th>Subtotal</th><th>Aksi</th></tr>
        </thead>
        <tbody id="cart-body"></tbody>
      </table>
      <p>Total: <b id="total-harga">Rp 0</b></p>
        <form id="order-form" onsubmit="submitOrder(event)">
            <p>Nama: <input id="nama" maxlength="40" required></p>
            <p>No. meja: <input id="meja" type="number" min="1" required></p>
            <p>Bayar:
                <select id="bayar" required>
                    <option value="" selected disabled>Pilih</option>
                    <option>Tunai di kasir</option>
                    <option>QRIS</option>
                </select>
            </p>
            <p>Catatan: <textarea id="catatan" maxlength="150"></textarea></p>
            <button type="submit">Pesan Sekarang</button>
        </form>
    </div>
    <div id="order-success"></div>

    <script src="data/food.json"></script>
    <script src="js/cart.js"></script>
  </body>
</html>
