<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Ilustrasi mangkuk berisi nasi, ayam panggang, alpukat, tomat, telur, dan sayuran">
  <defs>
    <clipPath id="isi">
      <circle cx="300" cy="300" r="196"/>
    </clipPath>
    <radialGradient id="mangkuk" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e2d2"/>
    </radialGradient>
    <linearGradient id="ayam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8ad5c"/>
      <stop offset="1" stop-color="#b9732f"/>
    </linearGradient>
    <radialGradient id="alpukat" cx="50%" cy="60%" r="60%">
      <stop offset="0" stop-color="#eef3a6"/>
      <stop offset="1" stop-color="#a9cc55"/>
    </radialGradient>
    <radialGradient id="tomat" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ff7a5c"/>
      <stop offset="1" stop-color="#d4321f"/>
    </radialGradient>
    <pattern id="nasi" width="22" height="18" patternUnits="userSpaceOnUse">
      <rect width="22" height="18" fill="#f7f2e6"/>
      <ellipse cx="6" cy="5" rx="5" ry="2.2" fill="#ffffff" transform="rotate(25 6 5)"/>
      <ellipse cx="16" cy="12" rx="5" ry="2.2" fill="#ece4d1" transform="rotate(-30 16 12)"/>
      <ellipse cx="17" cy="3" rx="4" ry="2" fill="#ffffff" transform="rotate(-10 17 3)"/>
      <ellipse cx="5" cy="14" rx="4" ry="2" fill="#efe8d6" transform="rotate(40 5 14)"/>
    </pattern>
    <filter id="bayangan" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0b1a10" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Daun hiasan di luar mangkuk -->
  <g fill="#7fae5f">
    <path d="M70 120 C 110 60, 190 70, 200 110 C 160 140, 100 150, 70 120 Z"/>
    <path d="M30 500 C 60 450, 120 460, 130 500 C 95 530, 50 530, 30 500 Z" fill="#9cc46f"/>
    <path d="M520 80 C 560 70, 585 110, 570 140 C 535 140, 515 115, 520 80 Z" fill="#6c9a50"/>
  </g>
  <g stroke="#4f7a3c" stroke-width="2" fill="none">
    <path d="M75 120 C 120 115, 160 112, 195 110"/>
    <path d="M35 500 C 65 495, 100 496, 128 500"/>
  </g>

  <!-- Mangkuk saus kecil -->
  <g filter="url(#bayangan)">
    <circle cx="528" cy="498" r="46" fill="url(#mangkuk)"/>
    <circle cx="528" cy="498" r="33" fill="#c5582c"/>
    <ellipse cx="517" cy="487" rx="11" ry="5" fill="#e0814f" opacity="0.8"/>
  </g>

  <!-- Mangkuk utama -->
  <g filter="url(#bayangan)">
    <circle cx="300" cy="300" r="232" fill="url(#mangkuk)"/>
  </g>
  <circle cx="300" cy="300" r="206" fill="#e6dec9"/>

  <!-- Isi mangkuk -->
  <g clip-path="url(#isi)">
    <!-- Dasar sayuran -->
    <circle cx="300" cy="300" r="200" fill="#5d8c47"/>

    <!-- Nasi -->
    <circle cx="190" cy="400" r="150" fill="url(#nasi)"/>
    <g fill="#2f2a22">
      <circle cx="150" cy="380" r="2.5"/><circle cx="200" cy="430" r="2.5"/>
      <circle cx="235" cy="390" r="2.5"/><circle cx="170" cy="460" r="2.5"/>
    </g>

    <!-- Daun-daun sayuran -->
    <g>
      <path d="M380 420 C 420 380, 480 390, 500 430 C 470 470, 410 470, 380 420 Z" fill="#7fb05a"/>
      <path d="M300 470 C 330 430, 390 440, 400 480 C 370 510, 320 505, 300 470 Z" fill="#4d7c3b"/>
      <path d="M420 250 C 460 220, 510 240, 510 280 C 480 300, 440 295, 420 250 Z" fill="#8cbc63"/>
      <path d="M110 230 C 130 190, 180 185, 200 215 C 180 250, 135 255, 110 230 Z" fill="#6fa04f"/>
    </g>

    <!-- Ayam panggang (4 potong) -->
    <g transform="rotate(-28 250 215)">
      <g>
        <rect x="150" y="140" width="52" height="150" rx="16" fill="url(#ayam)"/>
        <rect x="208" y="135" width="52" height="155" rx="16" fill="url(#ayam)"/>
        <rect x="266" y="138" width="52" height="150" rx="16" fill="url(#ayam)"/>
        <rect x="324" y="145" width="52" height="140" rx="16" fill="url(#ayam)"/>
      </g>
      <g stroke="#7d451a" stroke-width="7" stroke-linecap="round" opacity="0.75">
        <line x1="158" y1="190" x2="196" y2="170"/><line x1="158" y1="240" x2="196" y2="220"/>
        <line x1="216" y1="185" x2="254" y2="165"/><line x1="216" y1="235" x2="254" y2="215"/>
        <line x1="274" y1="188" x2="312" y2="168"/><line x1="274" y1="238" x2="312" y2="218"/>
        <line x1="332" y1="195" x2="370" y2="175"/><line x1="332" y1="242" x2="370" y2="222"/>
      </g>
    </g>

    <!-- Alpukat (3 iris) -->
    <g transform="rotate(18 430 340)">
      <g>
        <ellipse cx="400" cy="340" rx="30" ry="78" fill="#3f6b2a"/>
        <ellipse cx="403" cy="342" rx="24" ry="70" fill="url(#alpukat)"/>
        <ellipse cx="452" cy="338" rx="30" ry="78" fill="#3f6b2a"/>
        <ellipse cx="455" cy="340" rx="24" ry="70" fill="url(#alpukat)"/>
        <ellipse cx="504" cy="336" rx="30" ry="78" fill="#3f6b2a"/>
        <ellipse cx="507" cy="338" rx="24" ry="70" fill="url(#alpukat)"/>
      </g>
    </g>

    <!-- Tomat ceri -->
    <g>
      <circle cx="380" cy="150" r="30" fill="url(#tomat)"/>
      <circle cx="430" cy="185" r="27" fill="url(#tomat)"/>
      <circle cx="350" cy="110" r="24" fill="url(#tomat)"/>
      <g fill="#ffd2c4" opacity="0.8">
        <ellipse cx="370" cy="140" rx="8" ry="5"/>
        <ellipse cx="421" cy="176" rx="7" ry="4"/>
        <ellipse cx="343" cy="102" rx="6" ry="4"/>
      </g>
      <g fill="#3d6b2c">
        <path d="M380 122 l6 8 l9 -2 l-5 8 l5 8 l-9 -2 l-6 8 l-3 -9 l-9 -3 l9 -3 Z" transform="translate(0 2) scale(1)"/>
      </g>
    </g>

    <!-- Telur rebus (setengah) -->
    <g>
      <ellipse cx="330" cy="420" rx="56" ry="48" fill="#fffdf6"/>
      <circle cx="333" cy="418" r="25" fill="#f4ad25"/>
      <circle cx="326" cy="410" r="8" fill="#ffd36a"/>
    </g>

    <!-- Taburan wijen dan cabai -->
    <g fill="#fbf5e3">
      <ellipse cx="245" cy="215" rx="4" ry="2" transform="rotate(30 245 215)"/>
      <ellipse cx="300" cy="190" rx="4" ry="2" transform="rotate(-20 300 190)"/>
      <ellipse cx="270" cy="260" rx="4" ry="2" transform="rotate(10 270 260)"/>
      <ellipse cx="215" cy="260" rx="4" ry="2" transform="rotate(-40 215 260)"/>
    </g>
    <g fill="#d6402a">
      <rect x="320" y="240" width="7" height="3" rx="1.5" transform="rotate(20 320 240)"/>
      <rect x="230" y="300" width="7" height="3" rx="1.5" transform="rotate(-30 230 300)"/>
      <rect x="290" y="330" width="7" height="3" rx="1.5" transform="rotate(50 290 330)"/>
    </g>
  </g>

  <!-- Kilau di pinggir mangkuk -->
  <path d="M120 170 A 232 232 0 0 1 250 75" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8"/>
</svg>
